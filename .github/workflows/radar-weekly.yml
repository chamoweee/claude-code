# Opportunity Radar — weekly deep scan, Monday 07:00 Australia/Sydney.
#
# THE SCHEDULE IS DEACTIVATED ON PURPOSE. Until the secrets below are set, this
# workflow only runs when you trigger it by hand (Actions → Radar weekly → Run
# workflow). To go live, uncomment the `schedule:` block.
#
# Why two cron lines when it runs once a week: cron is UTC and Sydney is UTC+10
# in winter, UTC+11 under AEDT (from 4 Oct 2026). Both firings start the job and
# `radar.gate` asks zoneinfo what time it actually is in Sydney; the wrong one
# exits 0 in about a second having spent nothing. This needs no maintenance
# across daylight-saving changes, now or in any future year.

name: Radar weekly

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Run even if it is not Monday 7am in Sydney"
        type: boolean
        default: true
      dry_run:
        description: "Do everything except send the email"
        type: boolean
        default: false

  # Uncomment to go live. 20:00 UTC Sunday is 07:00 Monday AEDT;
  # 21:00 UTC Sunday is 07:00 Monday AEST.
  # schedule:
  #   - cron: "0 20 * * 0"
  #   - cron: "0 21 * * 0"

permissions:
  contents: write

concurrency:
  group: radar-weekly
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: opportunity-radar

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet -r requirements.txt

      - name: Restore history
        run: ../.github/scripts/radar-history.sh restore

      - name: Run the weekly deep scan
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RADAR_RECIPIENT: ${{ secrets.RADAR_RECIPIENT }}
          RADAR_PROFILE: ${{ secrets.RADAR_PROFILE }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          RADAR_FORCE: ${{ inputs.force && '1' || '' }}
        run: |
          python -m radar.jobs.weekly ${{ inputs.dry_run && '--dry-run' || '' }}

      # `always()` so a failed run still saves its log. The run_events rows are
      # the only record of what went wrong once the runner is gone.
      - name: Save history
        if: always()
        run: ../.github/scripts/radar-history.sh save "weekly scan"

      - name: Upload the rendered report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radar-weekly-report
          path: opportunity-radar/data/reports/
          retention-days: 14
          if-no-files-found: ignore
