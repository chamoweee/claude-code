# Research watchlist — tickers only, no positions, no holdings, no amounts.
#
# `confirmed` means the ticker has been resolved to a specific listed security.
# `active` means it currently trades and may be quoted. The price fetcher quotes
# only entries where both are true, so an ambiguous or delisted ticker can never
# be silently priced against the wrong instrument. `radar status` lists the rest.
# `quote_symbol` is the Yahoo symbol (ASX tickers take a .AX suffix).

