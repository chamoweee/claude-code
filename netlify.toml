# Netlify deployment for the shop.
# The site is static; only the checkout endpoint needs to run server-side.

[build]
  command = "node scripts/build-shop.js"
  publish = "shop"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/create-checkout-session"
  to = "/.netlify/functions/create-checkout-session"
  status = 200

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
